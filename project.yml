name: VibeMusic
options:
  bundleIdPrefix: com.vibe
  deploymentTarget:
    iOS: "16.0"

fileGroups:
  - Sources

targets:
  VibeMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.plist"
          - "**/*.md"
    info:
      path: Sources/VibeMusic/Info.plist
      properties:
        CFBundleDisplayName: Vibe Music
        CFBundleIdentifier: com.vibe.music
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        MinimumOSVersion: "16.0"
    settings:
      base:
        PRODUCT_NAME: VibeMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.music
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
