name: Build Vibe Music IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: VibeMusic

jobs:
  build:
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen 2.41.0
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o xg.zip
          unzip -q xg.zip
          BIN=$(find . -name "xcodegen" -type f | head -1)
          chmod +x "$BIN"
          sudo cp "$BIN" /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VibeMusic.xcodeproj -scheme $SCHEME

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project VibeMusic.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build_output.txt | grep -E "^(error:|warning: |.*error:)" | head -50 || true
          if grep -q "BUILD FAILED" build_output.txt; then
            grep "error:" build_output.txt | grep -v "^/Applications" | head -30
            exit 1
          fi

      - name: List DerivedData
        run: |
          echo "=== All .app files ==="
          find DerivedData -name "*.app" -type d 2>/dev/null || echo "No .app found"
          echo ""
          echo "=== DerivedData/Build/Products ==="
          ls -la DerivedData/Build/Products/ 2>/dev/null || echo "No Products dir"

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find DerivedData -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in DerivedData"
            find DerivedData -maxdepth 5 | head -30
            exit 1
          fi
          echo "Using: $APP"
          ls -la "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          cd Payload && ls
          cd ..
          zip -qr VibeMusic.ipa Payload
          ls -lh VibeMusic.ipa
          echo "SUCCESS"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic-${{ github.run_number }}
          path: VibeMusic.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build_output.txt
          retention-days: 7
