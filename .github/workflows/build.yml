name: Build Vibe Music IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: VibeMusic

jobs:
  build:
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install tools
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o xg.zip
          unzip -q xg.zip
          BIN=$(find . -name "xcodegen" -type f | head -1)
          chmod +x "$BIN"
          sudo cp "$BIN" /usr/local/bin/xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VibeMusic.xcodeproj -scheme $SCHEME

      - name: Build
        id: build
        run: |
          xcodebuild build \
            -project VibeMusic.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcode_full.log | xcpretty --color --simple || true
          
          echo ""
          echo "=============================="
          echo "SWIFT COMPILE ERRORS:"
          echo "=============================="
          grep -n "error:" /tmp/xcode_full.log | grep -v "^/Applications/Xcode_15" | grep -v "warning:" || echo "No errors found in grep"
          echo "=============================="
          
          if grep -q "\*\* BUILD FAILED \*\*" /tmp/xcode_full.log; then
            echo "BUILD FAILED"
            exit 1
          fi
          echo "BUILD SUCCEEDED"

      - name: Package IPA
        run: |
          APP=$(find DerivedData -name "*.app" -type d | grep -v xctest | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr VibeMusic.ipa Payload
          ls -lh VibeMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic-${{ github.run_number }}
          path: VibeMusic.ipa
          retention-days: 30

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-full-log-${{ github.run_number }}
          path: /tmp/xcode_full.log
          retention-days: 7
