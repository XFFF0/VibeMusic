name: Build Vibe Music IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: VibeMusic

jobs:
  build:
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o xg.zip
          unzip -q xg.zip
          BIN=$(find . -name "xcodegen" -type f | head -1)
          chmod +x "$BIN"
          sudo cp "$BIN" /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build and capture errors
        run: |
          xcodebuild build \
            -project VibeMusic.xcodeproj \
            -scheme VibeMusic \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 > /tmp/build_full.log || true

          # Extract Swift errors
          grep -E "Sources.*error:" /tmp/build_full.log | \
            sed "s|/Users/runner/work/VibeMusic/VibeMusic/||g" | \
            head -60 > build_errors.txt

          grep "BUILD SUCCEEDED\|\*\* BUILD FAILED" /tmp/build_full.log >> build_errors.txt

          echo "=== build_errors.txt ==="
          cat build_errors.txt

          git config user.email "ci@github.com"
          git config user.name "CI"
          git add build_errors.txt
          git commit -m "ci: errors [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true

          if grep -q "BUILD FAILED\|\*\* BUILD FAILED" /tmp/build_full.log; then
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(find DerivedData -name "VibeMusic.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/VibeMusic.app
          zip -qr VibeMusic.ipa Payload
          ls -lh VibeMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic-${{ github.run_number }}
          path: VibeMusic.ipa
          retention-days: 30
