name: Build Vibe Music IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: VibeMusic

jobs:
  build:
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen 2.41.0
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o xg.zip
          unzip -q xg.zip
          BIN=$(find . -name "xcodegen" -type f | head -1)
          chmod +x "$BIN"
          sudo cp "$BIN" /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VibeMusic.xcodeproj -scheme $SCHEME

      - name: Build
        run: |
          xcodebuild build \
            -project VibeMusic.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log
          if grep -q "BUILD FAILED\|\*\* BUILD FAILED \*\*" /tmp/xcodebuild.log; then
            echo "=== SWIFT ERRORS ==="
            grep -E "error:|swift.*error" /tmp/xcodebuild.log | grep -v "^/Applications/Xcode" | head -40
            exit 1
          fi

      - name: Package IPA
        run: |
          echo "=== Searching for .app ==="
          find DerivedData -name "*.app" -type d 2>/dev/null
          APP=$(find DerivedData -name "*.app" -type d | grep -v ".xctest" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi
          echo "Packaging: $APP"
          ls "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr VibeMusic.ipa Payload
          ls -lh VibeMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic-${{ github.run_number }}
          path: VibeMusic.ipa
          retention-days: 30

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-log-${{ github.run_number }}
          path: /tmp/xcodebuild.log
          retention-days: 7
