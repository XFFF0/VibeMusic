name: Build Vibe Music IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: VibeMusic

jobs:
  build:
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o xg.zip
          unzip -q xg.zip
          BIN=$(find . -name "xcodegen" -type f | head -1)
          chmod +x "$BIN"
          sudo cp "$BIN" /usr/local/bin/xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VibeMusic.xcodeproj -scheme $SCHEME

      - name: Build and commit errors
        run: |
          xcodebuild build \
            -project VibeMusic.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 > /tmp/build.log || true

          # Commit errors file to repo so we can read it via API
          grep "error:" /tmp/build.log | grep -v "/Applications/Xcode_15" > build_errors.txt || true
          echo "--- BUILD STATUS ---" >> build_errors.txt
          grep "BUILD SUCCEEDED\|BUILD FAILED" /tmp/build.log >> build_errors.txt || true

          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add build_errors.txt
          git commit -m "ci: build errors [skip ci]" || true
          git push || true

          if grep -q "BUILD FAILED" /tmp/build.log; then exit 1; fi

      - name: Package IPA
        run: |
          APP=$(find DerivedData -name "*.app" -type d | grep -v xctest | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr VibeMusic.ipa Payload
          ls -lh VibeMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic-${{ github.run_number }}
          path: VibeMusic.ipa
          retention-days: 30
