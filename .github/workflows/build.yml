name: Build Vibe Music IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: VibeMusic

jobs:
  build:
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o xg.zip
          unzip -q xg.zip
          BIN=$(find . -name "xcodegen" -type f | head -1)
          chmod +x "$BIN"
          sudo cp "$BIN" /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build
        run: |
          xcodebuild build \
            -project VibeMusic.xcodeproj \
            -scheme VibeMusic \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 > /tmp/build.log || true
          if grep -q "BUILD FAILED" /tmp/build.log; then
            grep "error:" /tmp/build.log | grep -v "/Applications/Xcode_15" | head -20
            exit 1
          fi
          echo "Build result:"
          grep "BUILD SUCCEEDED\|BUILD FAILED" /tmp/build.log

      - name: Package IPA
        run: |
          echo "=== Finding .app ==="
          find DerivedData -name "VibeMusic.app" -type d 2>/dev/null
          APP=$(find DerivedData -name "VibeMusic.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: App not found"
            find DerivedData -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "App: $APP"
          echo "App size: $(du -sh $APP)"
          ls "$APP" | head -10
          mkdir -p Payload
          cp -r "$APP" Payload/VibeMusic.app
          zip -qr VibeMusic.ipa Payload
          echo "IPA size: $(ls -lh VibeMusic.ipa | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic-${{ github.run_number }}
          path: VibeMusic.ipa
          retention-days: 30
